name: DualWave Linux
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libopus-dev pkg-config
      - run: cargo test -p ds-proto -p dualwave --locked
      - run: cargo clippy -p dualwave --all-targets --locked -- -D warnings
      - run: cargo build --release -p dualwave --locked
      - name: Check C ring concurrency and memory safety
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            $(pkg-config --cflags libpipewire-0.3) crates/dualwave/tests/pipewire_ring.c \
            $(pkg-config --libs libpipewire-0.3) -lpthread -lm -o /tmp/dualwave-ring-test
          /tmp/dualwave-ring-test
